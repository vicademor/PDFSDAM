<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - PDFSDAM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icon.png">
</head>
<body class="admin-body">

<div class="admin-header">
    <h2>⚙️ Panel de Administración PDFSDAM</h2>
    <a href="index.html">🏠 Inicio</a>
</div>

<div class="admin-main">

    <!-- Login con Google -->
    <section class="admin-section" id="loginSection">
        <h3>Acceso</h3>
        <button class="btn-login" id="loginBtn">🔑 Login con Google</button>
        <p id="loginStatus"></p>
    </section>

    <!-- Subida de PDFs -->
    <section class="admin-section" id="uploadSection" style="display:none">
        <h3>Subir archivo</h3>

        <label for="asignatura">Asignatura:</label>
        <select id="asignatura">
            <option value="programacion">Programación</option>
            <option value="sistemas">Sistemas</option>
            <option value="bases">Bases</option>
            <option value="entornos">Entornos</option>
            <option value="lenguajes">Lenguajes</option>
            <!-- Las asignaturas dinámicas se cargan aquí por JS -->
        </select>

        <label for="tipo">Tipo:</label>
        <select id="tipo">
            <option value="resumenes">Resumen</option>
            <option value="ejercicios">Ejercicio</option>
        </select>

        <label for="tema">Tema:</label>
        <input id="tema" type="text">

        <label for="nombre">Nombre del archivo:</label>
        <input id="nombre" type="text">

        <label for="pdfInput">Selecciona archivo:</label>
        <input id="pdfInput" type="file" accept=".pdf,.java,.rar">

        <progress id="uploadProgress" value="0" max="100"></progress>
        <p id="uploadStatus">Esperando archivo...</p>
        <a id="downloadLink" href="#" target="_blank" style="display:none;">Ver archivo subido</a>
    </section>

    <!-- Gestión de asignaturas -->
    <section class="admin-section" id="asignaturasSection" style="display:none">
        <h3>Añadir nueva asignatura</h3>

        <label for="asignaturaId">ID (sin espacios, minúsculas, ej: "redes"):</label>
        <input id="asignaturaId" type="text" placeholder="redes">

        <label for="asignaturaNombre">Nombre completo:</label>
        <input id="asignaturaNombre" type="text" placeholder="Redes de Comunicaciones">

        <label for="asignaturaCurso">Curso:</label>
        <select id="asignaturaCurso">
            <option value="1">1º DAM</option>
            <option value="2">2º DAM</option>
        </select>

        <label for="asignaturaDesc">Descripción (opcional):</label>
        <input id="asignaturaDesc" type="text">

        <button class="btn-admin" id="crearAsignaturaBtn">➕ Crear asignatura</button>
        <p id="asignaturaStatus"></p>
    </section>

    <!-- Gestión de PDFs -->
    <section class="admin-section" id="manageSection" style="display:none">
        <h3>Gestionar archivos</h3>
        <div id="pdfList">Cargando lista...</div>
    </section>

</div>

<!-- Script principal -->
<script type="module" src="js/admin.js"></script>
</body>
</html>
